<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Luxury car detailing studio website prototype: ceramic coating, PPF, paint correction, interior detailing and more.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Auto Detailing Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a dark detailing-studio world — hexagon ceiling lights, paint-gloss highlights, one champagne accent. Long scrolling home, hash-routed inner pages. */
:root{
  --ink:#0C1216; --panel:#131B21; --panel2:#19232B; --line:#26323C;
  --fg:#E8EDF0; --mute:#97A5AF; --accent:#D4A537; --accent-ink:#1A1206; --cool:#7DB6D8; --wa:#25D366; --gold-hi:#F6DC8E;
  --gold-grad:linear-gradient(115deg,color-mix(in srgb,var(--accent) 62%,#000) 0%,color-mix(in srgb,var(--accent) 42%,#fff) 22%,var(--accent) 42%,color-mix(in srgb,var(--accent) 72%,#000) 58%,color-mix(in srgb,var(--accent) 30%,#fff) 78%,var(--accent) 100%);
  --display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:clamp(1.6rem,3.4vw,2.6rem)}
h3{font-size:1.15rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding-inline:20px}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.lede{color:var(--mute);max-width:62ch;font-size:1.06rem}
section{padding-block:clamp(56px,8vw,104px)}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:20px;margin-bottom:36px}
.sec-head > div{display:grid;gap:12px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-weight:600;cursor:pointer;transition:transform .2s,background .2s,border-color .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wa{background:var(--wa);color:#05210f;border-color:var(--wa)}
.btn.ghost{background:transparent}
.btn svg{width:18px;height:18px;flex:none}
.mono{font-family:var(--mono)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--ink) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;height:72px}
.nav ul{list-style:none;display:flex;gap:4px;margin:0;padding:0}
.nav ul.right{justify-content:flex-end;align-items:center}
.nav ul a{padding:8px 12px;border-radius:999px;color:var(--mute);font-weight:500;font-size:.95rem;transition:color .2s,background .2s}
.nav ul a:hover,.nav ul a.on{color:var(--fg);background:var(--panel2)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:.02em}
.logo svg{width:34px;height:34px}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:10px;width:44px;height:44px;cursor:pointer;justify-self:end}
.burger span{display:block;width:18px;height:2px;background:var(--fg);margin:4px auto;transition:transform .25s}
.drawer{display:none}
@media (max-width:920px){
  .nav{grid-template-columns:1fr auto}
  .nav ul{display:none}
  .burger{display:block}
  .drawer{display:block;max-height:0;overflow:hidden;transition:max-height .35s ease}
  .drawer.open{max-height:520px}
  .drawer nav{display:grid;gap:4px;padding:8px 20px 20px}
  .drawer a{padding:12px 4px;border-bottom:1px solid var(--line);font-weight:500}
}

/* brand intro */
.intro{text-align:center;padding-block:64px 24px;display:grid;justify-items:center;gap:18px}
.intro .mark{width:110px;height:110px;filter:drop-shadow(0 10px 40px color-mix(in srgb,var(--accent) 35%,transparent))}
.intro h1{font-size:clamp(2.4rem,7vw,5.2rem);font-weight:800;letter-spacing:-.01em}
.intro h1 span{color:var(--accent)}
.intro p{color:var(--mute);max-width:56ch;font-size:1.1rem}
.intro .tag{font-family:var(--mono);font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--cool)}

/* welcome / hero */
.welcome{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:clamp(24px,5vw,64px);align-items:center;padding-block:40px 80px}
.welcome .copy{display:grid;gap:20px}
.welcome h2{font-size:clamp(1.7rem,3.6vw,2.8rem)}
.stats{display:flex;flex-wrap:wrap;gap:28px;margin-top:6px}
.stats div{display:grid}
.stats b{font-family:var(--display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.stats span{color:var(--mute);font-size:.86rem}
.cta-row{display:flex;flex-wrap:wrap;gap:12px}
.slides{position:relative;aspect-ratio:16/11;max-width:100%;border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.slides .sl{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease}
.slides .sl.on{opacity:1}
.slides .sl svg{width:100%;height:100%;display:block}
.slides .sl.on svg{animation:kb 7s ease-out both}
@keyframes kb{from{transform:scale(1.12) translateX(2%)}to{transform:scale(1) translateX(0)}}
.slides .cap{position:absolute;left:16px;bottom:16px;right:16px;display:flex;justify-content:space-between;align-items:end;gap:12px;z-index:2}
.slides .cap b{font-family:var(--display);font-size:1rem;background:rgba(8,12,15,.7);padding:8px 14px;border-radius:10px}
.dots{display:flex;gap:6px}
.dots button{width:26px;height:4px;border-radius:4px;border:0;background:rgba(255,255,255,.3);cursor:pointer;padding:0}
.dots button.on{background:var(--accent)}
@media (max-width:860px){.welcome{grid-template-columns:1fr}}

/* service cards */
.grid-svc{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:22px}
.svc{--mx:50%;--my:50%;--rx:0deg;--ry:0deg;position:relative;display:flex;flex-direction:column;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);overflow:hidden;transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .25s ease,border-color .25s,box-shadow .3s}
.svc-media{aspect-ratio:16/10;overflow:hidden;position:relative}
.svc-media svg,.svc-media img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.svc-body{padding:20px 20px 22px;display:grid;gap:10px;flex:1;align-content:start}
.svc-body p{color:var(--mute);font-size:.95rem}
.svc .more{margin-top:4px;font-weight:600;color:var(--accent);display:inline-flex;gap:6px;align-items:center}
.svc .more i{font-style:normal;transition:transform .25s}
.svc::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(420px circle at var(--mx) var(--my),rgba(255,255,255,.09),transparent 45%);opacity:0;transition:opacity .3s}
@media (hover:hover){
  .svc:hover{border-color:color-mix(in srgb,var(--accent) 60%,var(--line));box-shadow:0 26px 60px rgba(0,0,0,.55),0 0 0 1px color-mix(in srgb,var(--accent) 25%,transparent);transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(-8px)}
  .svc:hover .svc-media svg,.svc:hover .svc-media img{transform:scale(1.08)}
  .svc:hover::after{opacity:1}
  .svc:hover .more i{transform:translateX(6px)}
}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--mute);font-weight:500}
.chip.on{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.photo-tag{position:absolute;top:10px;right:10px;font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;background:rgba(8,12,15,.72);color:#cfd8de;padding:4px 8px;border-radius:6px;z-index:2}

/* band */
.band{background:linear-gradient(110deg,var(--panel2),var(--panel));border-block:1px solid var(--line);padding-block:42px}
.band .wrap{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.band h3{font-size:clamp(1.15rem,2.4vw,1.6rem);max-width:30ch}
.band p{color:var(--mute);margin-top:6px}

/* story */
.story{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(24px,5vw,72px);align-items:center}
.story .copy{display:grid;gap:18px}
.story .copy p{color:var(--mute)}
.story-art{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3;position:relative}
.story-art svg{width:100%;height:100%;display:block}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:8px}
.fact{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--panel)}
.fact b{display:block;font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.fact span{color:var(--mute);font-size:.86rem}
@media (max-width:860px){.story{grid-template-columns:1fr}}

/* videos */
.vids{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.vid{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#06090b;position:relative}
.vid canvas{display:block;width:100%;aspect-ratio:9/12;max-width:100%}
.vid .vbar{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;background:linear-gradient(transparent,rgba(5,8,10,.92));display:grid;gap:10px}
.vid .vbar h4{font-size:.98rem}
.vid .vbar p{color:#b6c2ca;font-size:.84rem}
.vid .ctl{display:flex;align-items:center;gap:10px}
.vid .ctl button{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.14);cursor:pointer;display:grid;place-items:center;color:#fff}
.vid .prog{flex:1;height:3px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
.vid .prog i{display:block;height:100%;width:0;background:var(--accent)}
.vid .ts{font-family:var(--mono);font-size:.72rem;color:#c8d2d8;font-variant-numeric:tabular-nums}
@media (max-width:900px){.vids{grid-template-columns:1fr;max-width:460px;margin-inline:auto}.vid canvas{aspect-ratio:4/5}}

/* trust */
.trust{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
.materials{display:grid;gap:12px}
.mat{display:grid;grid-template-columns:92px minmax(0,1fr);gap:16px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.mat .logo-slot{height:56px;border-radius:10px;border:1px dashed #3a4955;display:grid;place-items:center;font-family:var(--mono);font-size:.62rem;color:var(--mute);text-align:center;line-height:1.3}
.mat h4{font-family:var(--body);font-size:1rem;font-weight:600}
.mat p{color:var(--mute);font-size:.88rem}
.mat .spec{font-family:var(--mono);font-size:.74rem;color:var(--cool)}
.process{display:grid;gap:0;counter-reset:st;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:8px 22px}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step::before{counter-increment:st;content:counter(st,decimal-leading-zero);font-family:var(--mono);color:var(--accent);font-size:.9rem;padding-top:2px}
.step h4{font-family:var(--body);font-weight:600;font-size:1rem}
.step p{color:var(--mute);font-size:.9rem}
.warranty{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.warranty span{border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:.84rem;color:var(--mute)}
@media (max-width:900px){.trust{grid-template-columns:1fr}}

/* forms */
.form{display:grid;gap:14px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
label.f{display:grid;gap:6px;font-size:.86rem;color:var(--mute);font-weight:500}
.f input,.f select,.f textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:var(--fg);font-size:1rem}
.f textarea{min-height:96px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--accent)}
.f.bad input,.f.bad select{border-color:#e0705f}
.err{color:#f08b7b;font-size:.82rem;min-height:1em}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--ink);overflow:hidden}
.stepper button{width:46px;height:46px;border:0;background:var(--panel2);cursor:pointer;font-size:1.2rem}
.stepper input{border:0!important;text-align:center;background:transparent!important;border-radius:0!important}

/* fleet */
.fleet{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(24px,5vw,64px);align-items:start}
.fleet .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,30px)}
.est{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:12px;background:var(--ink);border:1px solid var(--line)}
.est b{font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.tiers{display:grid;gap:10px;margin-top:20px}
.tier{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:10px;border:1px solid var(--line)}
.tier b{color:var(--accent);font-family:var(--mono)}
@media (max-width:900px){.fleet{grid-template-columns:1fr}}

/* contact */
.contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:16px}
.cbox{border:1px solid var(--line);border-radius:var(--r);padding:20px;background:var(--panel);display:grid;gap:8px;align-content:start}
.cbox .big{font-family:var(--display);font-size:1.05rem;word-break:break-word}
.cbox p{color:var(--mute);font-size:.9rem}
.copy-btn{justify-self:start;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.8rem;cursor:pointer;color:var(--mute)}

/* reviews */
.revs{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:14px}
.rev{flex:0 0 min(340px,85%);scroll-snap-align:start;border:1px solid var(--line);border-radius:var(--r);padding:22px;background:var(--panel);display:grid;gap:14px;align-content:start}
.rev .stars{color:var(--accent);letter-spacing:3px}
.rev p{color:#cdd6dc}
.rev .who{display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;background:var(--panel2);border:1px solid var(--line);font-size:.85rem;flex:none}
.who small{display:block;color:var(--mute)}
.sample-note{font-family:var(--mono);font-size:.7rem;color:var(--mute);letter-spacing:.06em}

/* blog */
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:20px}
.post{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel);display:flex;flex-direction:column;transition:transform .25s,border-color .25s}
.post:hover{transform:translateY(-4px);border-color:var(--accent)}
.post .pm{aspect-ratio:16/9;overflow:hidden}
.post .pm svg{width:100%;height:100%;display:block}
.post .pb{padding:18px;display:grid;gap:8px}
.post .pb p{color:var(--mute);font-size:.9rem}
.post .meta{font-family:var(--mono);font-size:.72rem;color:var(--cool)}

/* page header */
.phead{padding-block:64px 32px;display:grid;gap:14px}
.phead h1{font-size:clamp(2rem,5vw,3.6rem);font-weight:800}
.crumbs{font-family:var(--mono);font-size:.76rem;color:var(--mute)}
.crumbs a{color:var(--accent)}

/* service detail */
.sd-hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center}
.sd-hero .media{border-radius:20px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/11;position:relative}
.sd-hero .media svg{width:100%;height:100%;display:block}
.specs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.specs div{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel)}
.specs b{display:block;font-family:var(--display);font-size:1rem}
.specs span{font-size:.78rem;color:var(--mute)}
.incl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:12px}
.incl div{display:flex;gap:12px;align-items:start;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.incl svg{width:20px;height:20px;flex:none;color:var(--accent);margin-top:2px}
.pk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.pkg{border:1px solid var(--line);border-radius:16px;padding:22px;background:var(--panel);display:grid;gap:12px;align-content:start}
.pkg.hot{border-color:var(--accent);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 10%,var(--panel)),var(--panel))}
.pkg .price{font-family:var(--display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.pkg ul{margin:0;padding-left:18px;color:var(--mute);font-size:.9rem;display:grid;gap:4px}
@media (max-width:900px){.sd-hero,.pk{grid-template-columns:1fr}}
.ba{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;border:1px solid var(--line);max-width:100%;user-select:none}
.ba .layer{position:absolute;inset:0}
.ba .layer svg{width:100%;height:100%;display:block}
.ba .after{clip-path:inset(0 0 0 var(--p,50%))}
.ba .handle{position:absolute;top:0;bottom:0;left:var(--p,50%);width:2px;background:#fff;transform:translateX(-1px);pointer-events:none}
.ba .handle::after{content:"◂ ▸";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#111;border-radius:999px;padding:6px 10px;font-size:.75rem;white-space:nowrap}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.ba .lbl{position:absolute;top:14px;font-family:var(--mono);font-size:.72rem;background:rgba(8,12,15,.75);padding:5px 10px;border-radius:6px;letter-spacing:.1em}
.faq details{border-bottom:1px solid var(--line);padding:18px 0}
.faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::after{content:"+";color:var(--accent);font-size:1.3rem;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq details p{color:var(--mute);margin-top:10px;max-width:70ch}

/* branches */
.branches{display:grid;gap:22px}
.br{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel);transition:border-color .25s,transform .25s}
.br:hover{border-color:var(--accent)}
.br .map{min-height:240px;position:relative}
.br .map svg{position:absolute;inset:0;width:100%;height:100%}
.br .bb{padding:clamp(18px,3vw,30px);display:grid;gap:12px;align-content:start}
.br .bb p{color:var(--mute)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{font-size:.8rem;border:1px solid var(--line);padding:4px 10px;border-radius:999px;color:var(--mute)}
@media (max-width:760px){.br{grid-template-columns:1fr}}

/* about */
.values{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:16px}
.val{border:1px solid var(--line);border-radius:var(--r);padding:22px;background:var(--panel);display:grid;gap:10px}
.val p{color:var(--mute);font-size:.94rem}
.timeline{display:grid;gap:0;border-left:2px solid var(--line);margin-left:8px}
.tl{padding:0 0 28px 26px;position:relative;display:grid;gap:4px}
.tl::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.tl b{font-family:var(--mono);color:var(--accent)}
.tl p{color:var(--mute)}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:16px}
.mem{border:1px solid var(--line);border-radius:var(--r);padding:20px;background:var(--panel);display:grid;gap:6px;justify-items:start}
.mem .avatar{width:56px;height:56px;font-size:1rem}
.mem span{color:var(--mute);font-size:.88rem}

/* article */
.article{max-width:720px;display:grid;gap:20px;padding-bottom:40px}
.article .cover{border-radius:18px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/8}
.article .cover svg{width:100%;height:100%;display:block}
.article p{color:#cdd6dc;font-size:1.06rem}
.article h3{margin-top:10px}

/* footer */
footer{border-top:1px solid var(--line);padding-block:56px 120px;background:#090E12}
.fgrid{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:28px}
.fgrid h4{font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:12px;font-weight:400}
.fgrid ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fgrid a:hover{color:var(--accent)}
.fgrid p{color:var(--mute);font-size:.92rem;max-width:36ch;margin-top:12px}
@media (max-width:800px){.fgrid{grid-template-columns:1fr 1fr}.fgrid > div:first-child{grid-column:1/-1}}

/* floating */
.fab-wa,.fab-chat{position:fixed;z-index:50;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:0;cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.45);transition:transform .2s}
.fab-wa{right:20px;bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--wa);color:#fff}
.fab-chat{right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink)}
.fab-wa:hover,.fab-chat:hover{transform:scale(1.07)}
.fab-wa svg,.fab-chat svg{width:28px;height:28px}
.fab-chat .ping{position:absolute;top:4px;right:4px;width:12px;height:12px;border-radius:50%;background:#e8584a;border:2px solid var(--ink)}
.fab-demo{position:fixed;left:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;border:1px dashed #44535f;background:rgba(12,18,22,.9);color:var(--mute);padding:8px 14px;border-radius:999px;font-family:var(--mono);font-size:.72rem;cursor:pointer}
.chat{position:fixed;right:20px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;width:min(370px,calc(100vw - 32px));height:min(540px,calc(100vh - 140px));background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);transform-origin:bottom right;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.chat-h{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
.chat-h b{display:block;font-size:.95rem}
.chat-h small{color:var(--wa)}
.chat-h button{margin-left:auto;background:none;border:0;cursor:pointer;font-size:1.4rem;color:var(--mute)}
.chat-b{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;font-size:.92rem;line-height:1.5}
.msg.bot{background:var(--panel2);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px;align-self:flex-end}
.msg a{color:var(--accent);font-weight:600;text-decoration:underline}
.quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.quick button{font-size:.8rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--fg)}
.chat-f{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chat-f input{flex:1;min-width:0;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--ink)}
.chat-f button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 16px;font-weight:600;cursor:pointer}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mute);margin:0 2px;animation:bl 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.2}}

/* modal */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(4,7,9,.72);backdrop-filter:blur(6px);animation:fade .3s ease}
@keyframes fade{from{opacity:0}}
.mbox{position:relative;width:min(560px,100%);max-height:calc(100vh - 32px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 40px 100px rgba(0,0,0,.7);animation:rise .4s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
.mtop{padding:24px 24px 6px;display:grid;gap:8px}
.mtop h3{font-size:1.35rem}
.mtop p{color:var(--mute);font-size:.94rem}
.mx{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:1.2rem;color:var(--fg)}
.mbody{padding:16px 24px 20px}
.mfoot{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.mfoot > div{padding:16px 20px;display:grid;gap:2px}
.mfoot > div + div{border-left:1px solid var(--line)}
.mfoot small{color:var(--mute);font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase}
.mfoot a{font-weight:600;word-break:break-all}
.sent{display:grid;gap:14px;text-align:center;justify-items:center;padding:10px 0}
.sent .tick{width:58px;height:58px;border-radius:50%;background:color-mix(in srgb,var(--accent) 18%,transparent);display:grid;place-items:center;color:var(--accent)}
.sent pre{text-align:left;white-space:pre-wrap;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-family:var(--mono);font-size:.78rem;color:var(--mute);width:100%;margin:0}
.sent .cta-row{justify-content:center}

/* reveal */
.rv{transition:transform .8s cubic-bezier(.2,.7,.2,1),opacity .8s}
.rv.pending{transform:translateY(28px);opacity:.15}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rv.pending{transform:none;opacity:1}
  html{scroll-behavior:auto}
}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--fg);color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:600;z-index:90;font-size:.9rem}
/* ===== v2: gold, 3D, hero video, motion ===== */
.btn.primary{background:var(--gold-grad);background-size:200% 100%;background-position:0 0;color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 70%,#000);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 38%,#000),0 12px 26px color-mix(in srgb,var(--accent) 26%,transparent),inset 0 1px 0 rgba(255,255,255,.55);position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s,background-position .7s}
.btn.primary:hover{background-position:100% 0;transform:translateY(-3px);box-shadow:0 7px 0 color-mix(in srgb,var(--accent) 38%,#000),0 20px 36px color-mix(in srgb,var(--accent) 36%,transparent),inset 0 1px 0 rgba(255,255,255,.55)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 38%,#000),0 4px 10px color-mix(in srgb,var(--accent) 20%,transparent)}
.btn.primary::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:shine 3.8s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,62%{left:-60%}100%{left:130%}}
.btn:active{transform:translateY(1px)}
.eyebrow,.stats b,.fact b,.pkg .price,.specs b,.est b,.tl b{background:var(--gold-grad);background-size:160% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.nav ul a{position:relative}
.nav ul a::after{content:"";position:absolute;left:14px;right:14px;bottom:3px;height:2px;border-radius:2px;background:var(--gold-grad);transform:scaleX(0);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.nav ul a:hover::after,.nav ul a.on::after{transform:scaleX(1)}
header.top{transition:box-shadow .3s,border-color .3s}
header.top.scrolled{box-shadow:0 12px 34px rgba(0,0,0,.5);border-bottom-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.logo{perspective:400px}
.logo svg{transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.logo:hover svg{transform:rotateY(360deg)}
.progress{position:fixed;left:0;right:0;top:0;height:3px;background:var(--gold-grad);transform-origin:0 50%;transform:scaleX(0);z-index:70;pointer-events:none}
.cursor-glow{position:fixed;left:-260px;top:-260px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 13%,transparent),transparent 65%);pointer-events:none;z-index:1;mix-blend-mode:screen;opacity:0;transition:opacity .5s}
.cursor-glow.on{opacity:1}

/* hero with background video */
.hero{position:relative;min-height:min(88svh,840px);display:grid;align-items:center;overflow:hidden;isolation:isolate;perspective:1200px;border-bottom:1px solid var(--line)}
.hero-media{position:absolute;inset:0;z-index:-2}
.hero-media canvas,.hero-media video{width:100%;height:100%;display:block;object-fit:cover}
.hero-shade{position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse 70% 60% at 50% 42%,rgba(8,12,16,.5),rgba(8,12,16,.3) 55%,rgba(8,12,16,.8)),linear-gradient(180deg,rgba(12,18,22,.5),transparent 28%,transparent 62%,var(--ink))}
.hero-in{display:grid;justify-items:center;text-align:center;gap:16px;padding-block:72px 120px;transform-style:preserve-3d;transform:translateY(var(--sy,0px)) rotateX(var(--hx,0deg)) rotateY(var(--hy,0deg));transition:transform .3s ease-out}
.hero-mark{transform:translateZ(60px);animation:coin 7s ease-in-out infinite}
.hero-mark svg{width:96px;height:96px;filter:drop-shadow(0 14px 30px color-mix(in srgb,var(--accent) 50%,transparent))}
@keyframes coin{0%,100%{transform:translateZ(60px) rotateY(-30deg) translateY(0)}50%{transform:translateZ(60px) rotateY(30deg) translateY(-10px)}}
.hero .tag{font-family:var(--mono);font-size:.78rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-hi);transform:translateZ(30px);animation:fadeUp .9s .1s both}
.hero-name{font-size:clamp(2.8rem,9.5vw,7.4rem);font-weight:800;letter-spacing:-.015em;line-height:1.02;padding-bottom:.1em;background:var(--gold-grad);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 1px 0 color-mix(in srgb,var(--accent) 62%,#000)) drop-shadow(0 2px 0 color-mix(in srgb,var(--accent) 48%,#000)) drop-shadow(0 3px 0 color-mix(in srgb,var(--accent) 34%,#000)) drop-shadow(0 4px 0 color-mix(in srgb,var(--accent) 22%,#000)) drop-shadow(0 18px 24px rgba(0,0,0,.7));transform:translateZ(80px);animation:goldShift 5s ease-in-out infinite alternate,nameIn 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes goldShift{from{background-position:0% 50%}to{background-position:100% 50%}}
@keyframes nameIn{from{opacity:0;transform:translateZ(80px) rotateX(55deg) scale(.85)}to{opacity:1;transform:translateZ(80px)}}
.hero-line{font-family:var(--display);font-weight:600;font-size:clamp(1.15rem,2.7vw,1.95rem);line-height:1.3;transform:translateZ(40px);text-shadow:0 4px 18px rgba(0,0,0,.6)}
.hero-line .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.1em}
.hero-line .w > span{display:inline-block;animation:wordUp 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.45s + var(--i) * .09s)}
@keyframes wordUp{from{transform:translateY(110%)}}
.hero-p{color:#c6d0d6;max-width:58ch;font-size:1.06rem;text-shadow:0 2px 12px rgba(0,0,0,.7);animation:fadeUp 1s .95s both}
.hero-cta{justify-content:center;margin-top:6px;animation:fadeUp 1s 1.15s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}}
.hero-scroll{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:grid;justify-items:center;gap:8px;font-family:var(--mono);font-size:.64rem;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.hero-scroll span{width:22px;height:34px;border:1.5px solid var(--mute);border-radius:12px;position:relative}
.hero-scroll span::after{content:"";position:absolute;left:50%;top:6px;width:4px;height:7px;margin-left:-2px;border-radius:2px;background:var(--accent);animation:scrollDot 1.7s infinite}
@keyframes scrollDot{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(14px)}}
.hero .photo-tag{top:auto;bottom:18px;right:18px}
@media (max-width:640px){.hero-in{padding-block:56px 104px}.hero .photo-tag{display:none}}
.marquee{overflow:hidden;border-bottom:1px solid var(--line);background:var(--panel);padding-block:16px}
.mq{display:flex;gap:28px;width:max-content;animation:mq 46s linear infinite;font-family:var(--display);font-size:1.02rem;white-space:nowrap;align-items:center}
.mq span{color:var(--mute)}
.mq span:nth-child(4n+1){color:var(--fg)}
.mq i{font-style:normal;font-size:.7rem;color:var(--accent)}
@keyframes mq{to{transform:translateX(-50%)}}

/* 3D depth */
.svc::after{background:radial-gradient(420px circle at var(--mx) var(--my),color-mix(in srgb,var(--accent) 24%,transparent),transparent 46%)}
@media (hover:hover){.svc:hover{box-shadow:calc(var(--ry) * -2) calc(26px + var(--rx) * 2) 60px rgba(0,0,0,.6),0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}}
.slides[data-tilt],.story-art[data-tilt],.media[data-tilt],.vid[data-tilt],.br[data-tilt]{transform:perspective(1100px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .35s ease,border-color .25s}
.band{background:linear-gradient(110deg,var(--panel2),var(--panel) 38%,color-mix(in srgb,var(--accent) 14%,var(--panel)) 50%,var(--panel) 62%,var(--panel2));background-size:300% 100%;animation:sheen 9s ease-in-out infinite alternate}
@keyframes sheen{from{background-position:0% 0}to{background-position:100% 0}}
.val,.mem,.cbox,.fact,.mat{transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .35s}
@media (hover:hover){.val:hover,.mem:hover,.cbox:hover,.fact:hover,.mat:hover{transform:perspective(800px) translateY(-6px) rotateX(4deg);border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:0 22px 40px rgba(0,0,0,.45)}}
.rev{transition:transform .35s,border-color .3s}
.rev:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
#app.enter{animation:pageIn .75s cubic-bezier(.2,.8,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(26px)}}
.rv{transition:transform 1s cubic-bezier(.2,.7,.2,1),opacity 1s,filter 1s}
.rv.pending{transform:perspective(1000px) translateY(50px) rotateX(16deg) scale(.97);opacity:.12;filter:blur(4px)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rv.pending{transform:none;opacity:1;filter:none}
}
/* living visuals */
.sw-a{animation:sweepA 5.5s cubic-bezier(.4,0,.2,1) infinite}
@keyframes sweepA{0%{transform:translateX(0)}50%,100%{transform:translateX(1200px)}}
.hexg{animation:hexPulse 3.2s ease-in-out infinite alternate}
@keyframes hexPulse{from{opacity:.5}to{opacity:1}}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 2.6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-5px) scale(.92)}to{transform:translateY(5px) scale(1.08)}}
.drip{animation:drip 2.2s ease-in infinite}
@keyframes drip{0%{transform:translateY(-8px);opacity:0}30%{opacity:.85}100%{transform:translateY(18px);opacity:0}}
.roll{animation:roll 4s ease-in-out infinite alternate}
@keyframes roll{to{transform:translateY(8px)}}
.tw{animation:tw 1.8s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.15}to{opacity:1}}
.spin{animation:spin .45s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wob{animation:wob 3s ease-in-out infinite alternate}
@keyframes wob{from{transform:translateX(-60px)}to{transform:translateX(70px)}}
.pulse{animation:tw 1.5s ease-in-out infinite alternate}
.dash{animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-48}}
.tap{animation:tap 1s ease-in-out infinite}
@keyframes tap{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
.story-art > svg,.post .pm svg{animation:kb2 14s ease-in-out infinite alternate}
@keyframes kb2{to{transform:scale(1.08)}}
.svc-media video,.sd-hero .media img,.sd-hero .media video{width:100%;height:100%;display:block;object-fit:cover}

/* real photos & videos */
.slides .sl img,.story-art img,.post .pm img,.article .cover img,.ba .layer img{width:100%;height:100%;object-fit:cover;display:block}
.slides .sl.on img{animation:kb 7s ease-out both}
.story-art > img,.post .pm img{animation:kb2 14s ease-in-out infinite alternate}
.post .pm img{transition:transform .6s}
.ba .dullimg img{filter:saturate(.25) brightness(.6) contrast(.8) sepia(.3) blur(.7px)}
.vid video{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;max-width:100%;background:#06090b}
.vid{transform:none!important;contain:paint}
@media (max-width:900px){.vid video{aspect-ratio:16/10}}
.hero-media video{transform:scale(1.04)}

/* FAQ */
.faq-wrap{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr);gap:clamp(24px,4vw,56px);align-items:start}
.faq-side{position:sticky;top:calc(96px + env(safe-area-inset-top,0px));display:grid;gap:16px;padding:26px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 12%,var(--panel)),var(--panel))}
.faq-side p{color:var(--mute)}
.faq-big{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:1;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
#faqList{display:grid;gap:10px;margin-top:18px}
#faqList details{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:0 20px;transition:border-color .3s,background .3s,transform .3s}
#faqList details:hover{transform:translateX(4px)}
#faqList details[open]{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:var(--panel2)}
#faqList summary{padding:18px 0;cursor:pointer;list-style:none;display:flex;gap:14px;align-items:center;font-weight:600}
#faqList summary::-webkit-details-marker{display:none}
#faqList .pm{margin-left:auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;transition:transform .4s cubic-bezier(.2,.8,.2,1),background .3s}
#faqList .pm::before{content:"+";color:var(--accent);font-size:1.15rem;line-height:1}
#faqList details[open] .pm{transform:rotate(135deg);background:color-mix(in srgb,var(--accent) 18%,transparent)}
.faq-a{color:var(--mute);padding:0 0 20px;max-width:68ch;animation:faqIn .45s cubic-bezier(.2,.8,.2,1)}
.faq-a small{display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cool);margin-bottom:6px}
@keyframes faqIn{from{opacity:0;transform:translateY(-8px)}}
@media (max-width:860px){.faq-wrap{grid-template-columns:1fr}.faq-side{position:static}}

/* ===== performance ===== */
header.top{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(12,18,22,.95)}
.modal{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(4,7,9,.84)}
.hero-name{animation:nameIn 1.3s cubic-bezier(.2,.8,.2,1) both;filter:drop-shadow(0 3px 0 color-mix(in srgb,var(--accent) 35%,#000)) drop-shadow(0 14px 18px rgba(0,0,0,.55))}
.hero-in{will-change:transform}
.btn.primary::after{left:0;transform:translateX(-160%) skewX(-20deg);animation:shine2 4s ease-in-out infinite;will-change:transform}
@keyframes shine2{0%,62%{transform:translateX(-160%) skewX(-20deg)}100%{transform:translateX(330%) skewX(-20deg)}}
.band{animation:none;background-size:100% 100%}
.rv{transition:transform .9s cubic-bezier(.2,.7,.2,1),opacity .9s}
.rv.pending{filter:none;transform:perspective(1000px) translateY(40px) rotateX(10deg)}
.cursor-glow{display:none}

const carPath=new Path2D(CAR), w1=new Path2D(WIN1), w2=new Path2D(WIN2);
const VIDS=[];
function initVideos(){
  $$("[data-vid]").forEach(el=>{
    const vEl=$("video",el);
    if(vEl){const btn=$("button",el),bar=$(".prog i",el),ts=$(".ts",el),V={el,video:vEl,user:null,playing:false,size(){}};
      vEl.addEventListener("timeupdate",()=>{const d=vEl.duration||8;bar.style.width=(vEl.currentTime/d*100).toFixed(1)+"%";ts.textContent=`0:${String(Math.floor(vEl.currentTime)).padStart(2,"0")} / 0:${String(Math.round(d)).padStart(2,"0")}`});
      btn.onclick=()=>{V.user=!V.playing;V.playing?pause(V):play(V)};VIDS.push(V);return}
    const cv=$("canvas",el), ctx=cv.getContext("2d"), kind=el.dataset.vid, btn=$("button",el), bar=$(".prog i",el), ts=$(".ts",el);
    const V={el,cv,ctx,kind,t:0,playing:false,user:null,last:0,dur:14,seed:rng(kind.length*77)};
    const parts=Array.from({length:140},()=>({x:V.seed(),y:V.seed(),r:V.seed(),v:V.seed()}));
    V.parts=parts;
    const size=()=>{const w=cv.clientWidth||300,h=cv.clientHeight||400,d=Math.min(2,window.devicePixelRatio||1);cv.width=w*d;cv.height=h*d;draw(V)};
    V.size=size; size();
    btn.onclick=()=>{V.user=!V.playing;V.playing?pause(V):play(V)};
    VIDS.push(V);
  });
  if(!VIDS.length) return;
  const io=new IntersectionObserver(es=>es.forEach(e=>{const V=VIDS.find(v=>v.el===e.target);if(!V)return;if(e.intersectionRatio>.5&&V.user!==false)play(V);else if(e.intersectionRatio<.2)pause(V)}),{threshold:[0,.2,.5,.8]});
  VIDS.forEach(V=>io.observe(V.el));
}
function play(V){if(V.playing)return;if(V.video){V.playing=true;V.video.play().catch(()=>{});$("button",V.el).innerHTML=ICON.pause;return}V.playing=true;$("button",V.el).innerHTML=ICON.pause;V.last=performance.now();const loop=now=>{if(!V.playing)return;V.t=(V.t+(now-V.last)/1000)%V.dur;V.last=now;draw(V);requestAnimationFrame(loop)};requestAnimationFrame(loop)}
function pause(V){if(V.video)V.video.pause();V.playing=false;$("button",V.el).innerHTML=ICON.play}
function draw(V){

  ctx.setTransform(1,0,0,1,0,0);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#1d2a34");g.addColorStop(.62,"#0f171d");g.addColorStop(1,"#070a0d");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  ctx.save();ctx.strokeStyle="rgba(233,242,247,.55)";ctx.lineWidth=2.4*s*1.4;
  for(let row=0;row<4;row++)for(let c=0;c<10;c++){const x=c*66*s*.85+(row%2?28*s:0),y=30*s+row*34*s;ctx.globalAlpha=.8-row*.18;ctx.beginPath();for(let i=0;i<7;i++){const a=Math.PI/3*i;ctx[i?"lineTo":"moveTo"](x+20*s*Math.cos(a),y+20*s*Math.sin(a))}ctx.stroke()}
  ctx.restore();
  ctx.fillStyle="#0a1014";ctx.fillRect(0,oy+395*s,W,H);
  ctx.save();ctx.translate(ox,oy);ctx.scale(s,s);
  const sh=ctx.createRadialGradient(415,402,10,415,402,380);sh.addColorStop(0,"rgba(0,0,0,.75)");sh.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=sh;ctx.save();ctx.scale(1,.07);ctx.beginPath();ctx.arc(415,402/.07,380,0,7);ctx.fill();ctx.restore();
  const hue=kind==="foam"?205:kind==="polish"?0:214;

  const pg=ctx.createLinearGradient(0,200,0,360);pg.addColorStop(0,`hsl(${hue} ${58-dull*40}% ${60-dull*18}%)`);pg.addColorStop(.5,`hsl(${hue} ${58-dull*40}% 32%)`);pg.addColorStop(1,`hsl(${hue} 50% 12%)`);
  ctx.fillStyle=pg;ctx.fill(carPath);

  ctx.strokeStyle="rgba(255,255,255,.45)";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(60,292);ctx.quadraticCurveTo(420,262,760,296);ctx.stroke();

    if(p>.5&&p<.82){for(let i=0;i<26;i++){const x=rinse-80+i*4;ctx.strokeStyle="rgba(170,215,240,.5)";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,190);ctx.lineTo(x-20,380);ctx.stroke()}}
  }
  if(kind==="polish"){

    $$("[data-tilt]").forEach(c=>{c.addEventListener("pointermove",e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty("--mx",x*100+"%");c.style.setProperty("--my",y*100+"%");const A=+(c.dataset.tilt||13);c.style.setProperty("--ry",((x-.5)*A).toFixed(2)+"deg");c.style.setProperty("--rx",((.5-y)*A).toFixed(2)+"deg")});
      c.addEventListener("pointerleave",()=>{c.style.setProperty("--rx","0deg");c.style.setProperty("--ry","0deg")})})}
  // reveal + counters
  const vh=innerHeight;
  $$(".grid-svc,.posts,.contact-grid,.incl,.values,.vids,.materials,.pk,.branches,.facts").forEach(g=>[...g.children].filter(c=>c.classList.contains("rv")).forEach((c,i)=>{c.style.transitionDelay=(i%4)*110+"ms"}));
  const settle=el=>setTimeout(()=>{el.classList.remove("rv");el.style.transitionDelay=""},1400);
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.remove("pending");io.unobserve(e.target);settle(e.target)}}),{threshold:.12});
  $$(".rv").forEach(el=>{if(el.getBoundingClientRect().top>vh*.92){el.classList.add("pending");io.observe(el)}else{el.style.transitionDelay="";el.classList.remove("rv")}});
  const co=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;co.unobserve(e.target);const end=+e.target.dataset.count,t0=performance.now();const step=n=>{const k=Math.min(1,(n-t0)/1400);e.target.textContent=Math.round(end*(1-Math.pow(1-k,3))).toLocaleString("en-IN")+(end>=1000?"+":"");if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}),{threshold:.5});
  $$("[data-count]").forEach(el=>co.observe(el));
}
